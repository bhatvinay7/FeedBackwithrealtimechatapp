name:
    reach build
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev   
permissions:
    id-token: write
    contents: read    
jobs:
  build-and-push:
    environment: staging
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}    

      - name: Build & Push kafka_consumer_1
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./kafka_consumer_1/Dockerfile.staging
          build-args: |
                DATABASE_URL=${{secrets.DATABASE_URL}}      
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer1:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer1:latest

      - name: Build & Push kafka_consumer_2
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./kafka_consumer_2/Dockerfile.staging
          build-args: |
                DATABASE_URL=${{secrets.DATABASE_URL}}      
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer2:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer2:latest

      - name: Build & Push ws-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ws-server/Dockerfile.staging
          build-args: |
                DATABASE_URL=${{secrets.DATABASE_URL}}  
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/reach-ws-server:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/reach-ws-server:latest    

      - name: Build & push reach_backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./reach-backend/Dockerfile.staging
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/reach-backend:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/reach-backend:latest    
      
      - name: Build & push reach
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./reach-frontend/Dockerfile.staging
          build-args: |
                NEXT_PUBLIC_BACKEND_API_URL=${{secrets.NEXT_PUBLIC_BACKEND_API_URL}}
                NEXT_PUBLIC_FRONTEND_API_URL=${{secrets.NEXT_PUBLIC_FRONTEND_API_URL}}
                NEXT_PUBLIC_WS_SERVER=${{secrets.NEXT_PUBLIC_WS_SERVER}}
                
                DATABASE_URL=${{secrets.DATABASE_URL}}   
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/reach-frontend:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/reach-frontend:latest    

      
  Deploy:  
    runs-on: ubuntu-latest
    environment: staging
    needs: build-and-push
    env:
        COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install kubeseal
        run: |
            KUBESEAL_VERSION="v0.32.2"
            curl -OL "https://github.com/bitnami-labs/sealed-secrets/releases/download/${KUBESEAL_VERSION}/kubeseal-0.32.2-linux-amd64.tar.gz"
            tar -xvzf kubeseal-0.32.2-linux-amd64.tar.gz kubeseal
            sudo install -m 755 kubeseal /usr/local/bin/kubeseal


      # - name : Install CA for AWS eks
      #   run: |
      #     sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Checkout GitOps repo
        run: |
          export GITOPS_BRANCH=${{secrets.GITOPS_BRANCH}}
          export GITOPS_REPO=${{secrets.GITOPS_REPO}}
          export TOKEN=${{secrets.TOKEN}}
          export DOCKER_USERNAME=${{secrets.DOCKER_USERNAME}}
          mkdir -p ~/gitops
          
          sudo apt-get update && sudo apt-get install -y git yq
          git clone --branch $GITOPS_BRANCH https://$TOKEN@github.com/$DOCKER_USERNAME/$GITOPS_REPO.git  ~/gitops
          
    
      - name: Update YAML images
        run: |
          cd ~/gitops/Helm/chart.staging/services
          export GITOPS_BRANCH=${{secrets.GITOPS_BRANCH}}
          export DOCKER_USERNAME=${{secrets.DOCKER_USERNAME}} 
          git checkout $GITOPS_BRANCH


          declare -A services=(
          ["reach-frontend"]="reach-frontend"
          ["reach-backend"]="reach-backend"
          ["reach-ws-server"]="reach-ws-server"
          ["reach-consumer1"]="reach-consumer1"
          ["reach-consumer2"]="reach-consumer2" )

          for dir in "${!services[@]}"; do
          cd "$dir"
          key=${services[$dir]}
          yq -i -y "(.services[].image) = \"${DOCKER_USERNAME}/${key}:${GITHUB_SHA}\"" values.staging.yml
          cd ..
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.ACTION_ROLE}}
          aws-region: ${{secrets.AWS_REGION}}

      - name: Setup Kubeconfig
        run: |
          export KUBERNETES_CLUSTER_REGION=${{secrets.KUBERNETES_CLUSTER_REGION}}
          export KUBERNETES_CLUSTER_NAME=${{secrets.KUBERNETES_CLUSTER_NAME}}
          aws eks update-kubeconfig --region $KUBERNETES_CLUSTER_REGION --name $KUBERNETES_CLUSTER_NAME
          kubectl get nodes
      # - name: Authenticate to GCP
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: "projects/${{secrets.PROJECT_NUMBER}}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
      #     service_account: "feedbackwithrealtimechatapp@${{secrets.PROJECT_ID}}.iam.gserviceaccount.com"

      # - name: Authenticate to GCP
      #   uses: google-github-actions/auth@v2
      #   with:
      #    credentials_json: ${{ secrets.GCP_WIF_JSON }}

      # - name: Setup gcloud
      #   uses: google-github-actions/setup-gcloud@v2
      #   with:
      #     project_id: ${{secrets.PROJECT_ID}}

      # - name: Get GKE credentials
      #   run: |
      #     export KUBERNETES_CLUSTER_REGION=${{secrets.ZONE}}
      #     export CLUSTER_NAME=${{secrets.CLUSTER_NAME}}
      #     export PROJECT_ID=${{secrets.PROJECT_ID}}
      #     gcloud container clusters get-credentials $KUBERNETES_CLUSTER_NAME --zone $KUBERNETES_CLUSTER_REGION --project PROJECT_ID

      - name : Setup  Seal secret --controller-name
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo  update
     
          if helm status sealed-secrets -n sealed-secrets >/dev/null 2>&1; then
          echo "Sealed Secrets already installed. Upgrading..."
          helm upgrade sealed-secrets bitnami/sealed-secrets -n sealed-secrets
          else
          echo "Installing Sealed Secrets..."
          helm install sealed-secrets bitnami/sealed-secrets --namespace sealed-secrets --create-namespace
          fi

      - name : create scripts/create-secrets.sh
        run : |
          mkdir -p scripts
          touch scripts/create-secrets.sh
          cat << 'EOF' > scripts/create-secrets.sh
          set -e
          cd ~/gitops/Helm/chart.staging/services
          kubeseal --fetch-cert \
          --controller-name sealed-secrets \
          --controller-namespace sealed-secrets \
          > pub-sealed-secrets.pem
           
          kubectl get namespace feedback-services >/dev/null 2>&1 || \
          kubectl create namespace feedback-services

          kubectl get namespace kafka >/dev/null 2>&1 || \
          kubectl create namespace kafka

          kubectl create secret docker-registry docker-sealed-secret \
          --docker-server=https://index.docker.io/v1/ \
          --docker-username="$DOCKER_USERNAME" \
          --docker-password="$DOCKER_PASSWORD" \
          --docker-email="$USER_EMAIL" \
          --namespace=feedback-services \
          --dry-run=client -o yaml \
          | kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          > secrets/docker-sealed-secret.yaml

          kubectl create secret generic  kafka-user-sealed-secret \
          --from-literal=username="$KAFKA-USERNAME" \
          --from-literal=password="$KAFKA-PASSWORD" \
          --namespace=kafka \
          --dry-run=client -o yaml \
          | kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          > secrets/kafka-user-sealed-secret.yaml

          kubectl create secret generic frontend-sealed-secret \
          --from-literal=NEXT_PUBLIC_BACKEND_API_URL="$NEXT_PUBLIC_BACKEND_API_URL" \
          --from-literal=secret_key="$SECRET_KEY" \
          --from-literal=NEXT_PUBLIC_FRONTEND_API_URL="$NEXT_PUBLIC_FRONTEND_API_URL" \
          --from-literal=NEXT_PUBLIC_WS_SERVER="$NEXT_PUBLIC_WS_SERVER" \
          --namespace=feedback-services \
          --dry-run=client -o yaml \
          | kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          > secrets/frontend-sealed-secret.yaml

          kubectl create secret generic backend-sealed-secret \
          --from-literal=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
          --from-literal=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
          --from-literal=NEXT_PUBLIC_FRONTEND_API_URL="$NEXT_PUBLIC_FRONTEND_API_URL" \
          --from-literal=secret_key="$SECRET_KEY" \
          --from-literal=DATABASE_URL="$DATABASE_URL" \
          --from-literal=Redis_URL="$REDIS_URL" \
          --from-literal=password="$REDIS_PASSWORD" \
          --from-literal=port="$REDIS_PORT" \
          --namespace=feedback-services \
          --dry-run=client -o yaml \
          | kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          > secrets/backend-sealed-secret.yaml


          kubectl create secret generic kafka-consumer-sealed-secret \
          --from-literal=DATABASE_URL="$DATABASE_URL" \
          --from-literal=Redis_URL="$REDIS_URL" \
          --from-literal=redis_password="$REDIS_PASSWORD" \
          --from-literal=port="$REDIS_PORT" \
          --from-literal=username="$KAFKA-USERNAME" \
          --from-literal=password="$KAFKA-PASSWORD" \
          --namespace=kafka \
          --dry-run=client -o yaml \
          | kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          > secrets/kafka-consumer-sealed-secret.yaml

          kubectl create secret generic ws-sealed-secret \
          --from-literal=DATABASE_URL="$DATABASE_URL" \
          --from-literal=Redis_URL="$REDIS_URL" \
          --from-literal=redis_password="$REDIS_PASSWORD" \
          --from-literal=port="$REDIS_PORT" \
          --from-literal=username="$KAFKA-USERNAME" \
          --from-literal=password="$KAFKA-PASSWORD" \
          --namespace=feedback-services \
          --dry-run=client -o yaml \
          | kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          > secrets/ws-sealed-secret.yaml
          EOF


          chmod +x scripts/create-secrets.sh
                
      - name: Create and Seal Secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          NEXT_PUBLIC_BACKEND_API_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_API_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NEXT_PUBLIC_FRONTEND_API_URL: ${{ secrets.NEXT_PUBLIC_FRONTEND_API_URL }}
          NEXT_PUBLIC_WS_SERVER: ${{ secrets.NEXT_PUBLIC_WS_SERVER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          username: ${{ secrets.KAFKA_USERNAME}}
          password: ${{ secrets.KAFKA_PASSWORD}}
          email: ${{ secrets.USER_EMAIL}}

        run: |
          bash scripts/create-secrets.sh
          cd ~/gitops/Helm/chart.staging/services
          rm -rf pub-sealed-secrets.pem
          mv secrets/kafka-user-sealed-secret.yaml ../kafka-cluster/secrets/kafka-user-sealed-secret.yaml
          
      - name: Commit and Push Changes
        run: |
          export GITOPS_BRANCH=${{secrets.GITOPS_BRANCH}}
          export GITOPS_REPO=${{secrets.GITOPS_REPO}}
          export TOKEN=${{secrets.TOKEN}}
          export DOCKER_USERNAME=${{secrets.DOCKER_USERNAME}}
          cd ~/gitops
          git checkout $GITOPS_BRANCH
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git add --renormalize .
          git add .
          if git diff-index --quiet HEAD --; then
          echo "No changes to commit"
          else
          git commit -m "Update images to SHA ${GITHUB_SHA}"

          git push https://x-access-token:$TOKEN@github.com/$DOCKER_USERNAME/$GITOPS_REPO.git $GITOPS_BRANCH

          fi
      
  
        
           
                  
    

      
