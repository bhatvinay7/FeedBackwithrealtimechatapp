name:
    reach build
on:
  push:
    branches:
      - staging 
  pull_request:
    branches:
      - staging   
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}    

      - name: Build & Push kafka_consumer_1
        uses: docker/build-push-action@v5
        with:
          context: ./kafka_consumer_1
          file: ./kafka_consumer_1/Dockerfile.staging
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer_1:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer_1:latest

      - name: Build & Push kafka_consumer_2
        uses: docker/build-push-action@v5
        with:
          context: ./kafka_consumer_2
          file: ./kafka_consumer_2/Dockerfile.staging 
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer_2:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer_2:latest

      - name: Build & Push ws-server
        uses: docker/build-push-action@v5
        with:
          context: ./ws-server
          file: ./ws-server/Dockerfile.staging
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ws-server:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/ws-server:latest    

      - name: Build & push reach_backend
        uses: docker/build-push-action@v5
        with:
          context: ./reach_backend
          file: ./reach_backend/Dockerfile.staging
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/reach_backend:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/reach_backend:latest    
      
      - name: Build & push reach
        uses: docker/build-push-action@v5
        with:
          context: ./reach
          file: ./reach/Dockerfile.staging
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/reach:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/reach:latest    

      
  Deploy:  
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
        COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: deploy to VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl start docker
            sudo systemctl start nginx  
            sudo apt install curl -y
            sudo apt install -y python3-pip
            sudo apt install curl -y
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt install -y nodejs       
            sudo docker network create kafka-network || true
            sudo docker stop $(sudo docker ps -q) && sudo docker rm $(sudo docker ps -aq) && sudo docker rmi $(docker images -q)
            sudo docker system prune -af
            
           
                  
    

      