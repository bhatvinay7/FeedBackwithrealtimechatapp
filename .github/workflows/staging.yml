name:
    reach build
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev   
permissions:
    id-token: write
    contents: read    
jobs:
  build-and-push:
    environment: staging
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}    

      - name: Build & Push kafka_consumer_1
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./kafka_consumer_1/Dockerfile.staging
          build-args: |
                DATABASE_URL=${{secrets.DATABASE_URL}}      
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer1:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer1:latest

      - name: Build & Push kafka_consumer_2
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./kafka_consumer_2/Dockerfile.staging
          build-args: |
                DATABASE_URL=${{secrets.DATABASE_URL}}      
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer2:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer2:latest

      - name: Build & Push ws-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ws-server/Dockerfile.staging
          build-args: |
                DATABASE_URL=${{secrets.DATABASE_URL}}  
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/reach-ws-server:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/reach-ws-server:latest    

      - name: Build & push reach_backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./reach-backend/Dockerfile.staging
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/reach-backend:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/reach-backend:latest    
      
      - name: Build & push reach
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./reach-frontend/Dockerfile.staging
          build-args: |
                NEXT_PUBLIC_BACKEND_API_URL=${{secrets.NEXT_PUBLIC_BACKEND_API_URL}}
                NEXT_PUBLIC_FRONTEND_API_URL=${{secrets.NEXT_PUBLIC_FRONTEND_API_URL}}
                NEXT_PUBLIC_WS_SERVER=${{secrets.NEXT_PUBLIC_WS_SERVER}}
                
                DATABASE_URL=${{secrets.DATABASE_URL}}   
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/reach-frontend:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/reach-frontend:latest    

      
  Deploy:  
    runs-on: ubuntu-latest
    environment: staging
    needs: build-and-push
    env:
        COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install kubeseal
        run: |
            KUBESEAL_VERSION="v0.32.2"
            curl -OL "https://github.com/bitnami-labs/sealed-secrets/releases/download/${KUBESEAL_VERSION}/kubeseal-0.32.2-linux-amd64.tar.gz"
            tar -xvzf kubeseal-0.32.2-linux-amd64.tar.gz kubeseal
            sudo install -m 755 kubeseal /usr/local/bin/kubeseal


      - name : Install CA for AWS eks
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Checkout GitOps repo
        run: |
          export GITOPS_BRANCH=${{secrets.GITOPS_BRANCH}}
          export GITOPS_REPO=${{secrets.GITOPS_REPO}}
          export TOKEN=${{secrets.TOKEN}}
          mkdir -p ~/gitops
          
          sudo apt-get update && sudo apt-get install -y git yq
          export DOCKER_USERNAME=${{secrets.DOCKER_USERNAME}}
          git clone --branch $GITOPS_BRANCH https://$TOKEN@github.com/$DOCKER_USERNAME/$GITOPS_REPO.git  ~/gitops
          
    
      - name: Update YAML images
        run: |
          cd ~/gitops/Helm/chart.prod
          export GITOPS_BRANCH=${{secrets.GITOPS_BRANCH}}
          git checkout $GITOPS_BRANCH

          yq  -i  -y ".services.frontend.image = \"reach-frontend:${GITHUB_SHA}\"" values.prod.yml
          yq  -i  -y ".services.backend.image = \"reach-backend:${GITHUB_SHA}\"" values.prod.yml
          yq  -i  -y ".services.\"ws-server.image\" = \"ws-server:${GITHUB_SHA}\"" values.prod.yml
          yq  -i  -y ".services.\"kafka_consumer1.image\" = \"kafka_consumer1:${GITHUB_SHA}\"" values.prod.yml
          yq  -i  -y ".services.\"kafka_consumer2.image\" = \"kafka_consumer2:${GITHUB_SHA}\"" values.prod.yml

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.ACTION_ROLE}}
          aws-region: ${{secrets.AWS_REGION}}

      - name: Setup Kubeconfig
        run: |
          export KUBERNETES_CLUSTER_REGION=${{secrets.KUBERNETES_CLUSTER_REGION}}
          export KUBERNETES_CLUSTER_NAME=${{secrets.KUBERNETES_CLUSTER_NAME}}
          aws eks update-kubeconfig --region $KUBERNETES_CLUSTER_REGION --name $KUBERNETES_CLUSTER_NAME
          kubectl get nodes
      - name : Setup  Seal secret --controller-name
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo  update
     
          if helm status sealed-secrets -n sealed-secrets >/dev/null 2>&1; then
          echo "Sealed Secrets already installed. Upgrading..."
          helm upgrade sealed-secrets bitnami/sealed-secrets -n sealed-secrets
          else
          echo "Installing Sealed Secrets..."
          helm install sealed-secrets bitnami/sealed-secrets --namespace sealed-secrets --create-namespace
          fi


      - name : create scripts/create-secrets.sh
        run : |
          mkdir -p scripts
          touch scripts/create-secrets.sh
          cat << 'EOF' > scripts/create-secrets.sh
          set -e
          cd ~/gitops/Helm/chart.prod


          kubeseal --fetch-cert \
          --controller-name sealed-secrets \
          --controller-namespace sealed-secrets \
          > pub-sealed-secrets.pem

          kubectl create secret docker-registry docker-secret \
          --docker-username="$DOCKER_USERNAME" \
          --docker-password="$DOCKER_PASSWORD" \
          --namespace=default \
          --dry-run=client -o yaml \
          | kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          > secrets/docker-sealed-secret.yaml

          kubectl create secret generic frontend-secret \
          --from-literal=NEXT_PUBLIC_BACKEND_API_URL="$NEXT_PUBLIC_BACKEND_API_URL" \
          --from-literal=secret_key="$SECRET_KEY" \
          --from-literal=NEXT_PUBLIC_FRONTEND_API_URL="$NEXT_PUBLIC_FRONTEND_API_URL" \
          --from-literal=NEXT_PUBLIC_WS_SERVER="$NEXT_PUBLIC_WS_SERVER" \
          --namespace=default \
          --dry-run=client -o yaml \
          | kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          > secrets/frontend-sealed-secret.yaml

          kubectl create secret generic backend-secret \
          --from-literal=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
          --from-literal=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
          --from-literal=NEXT_PUBLIC_FRONTEND_API_URL="$NEXT_PUBLIC_FRONTEND_API_URL" \
          --from-literal=secret_key="$SECRET_KEY" \
          --from-literal=DATABASE_URL="$DATABASE_URL" \
          --from-literal=Redis_URL="$REDIS_URL" \
          --from-literal=password="$REDIS_PASSWORD" \
          --from-literal=port="$REDIS_PORT" \
          --namespace=default \
          --dry-run=client -o yaml \
          | kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          > secrets/backend-sealed-secret.yaml


          kubectl create secret generic kafka-consumer-secret \
          --from-literal=DATABASE_URL="$DATABASE_URL" \
          --namespace=default \
          --dry-run=client -o yaml \
          | kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          > secrets/kafka-consumer-sealed-secret.yaml

          kubectl create secret generic ws-secret \
          --from-literal=DATABASE_URL="$DATABASE_URL" \
          --from-literal=Redis_URL="$REDIS_URL" \
          --from-literal=password="$REDIS_PASSWORD" \
          --from-literal=port="$REDIS_PORT" \
          --namespace=default \
          --dry-run=client -o yaml \
          | kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          > secrets/ws-sealed-secret.yaml
          EOF

          chmod +x scripts/create-secrets.sh

                
      - name: Create and Seal Secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          NEXT_PUBLIC_BACKEND_API_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_API_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NEXT_PUBLIC_FRONTEND_API_URL: ${{ secrets.NEXT_PUBLIC_FRONTEND_API_URL }}
          NEXT_PUBLIC_WS_SERVER: ${{ secrets.NEXT_PUBLIC_WS_SERVER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }
        run: bash scripts/create-secrets.sh
          

      - name: Commit and Push Changes
        run: |
          cd gitops
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git add .
          git commit -m "Update images to SHA ${GITHUB_SHA}"
          git push
      
  
        
           
                  
    

      
