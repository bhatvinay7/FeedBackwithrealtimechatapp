name:
    reach build
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev   
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}    

      - name: Build & Push kafka_consumer_1
        uses: docker/build-push-action@v5
        with:
          context: ./kafka_consumer_1
          file: ./kafka_consumer_1/Dockerfile.staging
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer1:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer1:latest

      - name: Build & Push kafka_consumer_2
        uses: docker/build-push-action@v5
        with:
          context: ./kafka_consumer_2
          file: ./kafka_consumer_2/Dockerfile.staging 
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer2:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/kafka_consumer2:latest

      - name: Build & Push ws-server
        uses: docker/build-push-action@v5
        with:
          context: ./ws-server
          file: ./ws-server/Dockerfile.staging
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/reach-ws-server:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/reach-ws-server:latest    

      - name: Build & push reach_backend
        uses: docker/build-push-action@v5
        with:
          context: ./reach_backend
          file: ./reach_backend/Dockerfile.staging
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/reach_backend:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/reach_backend:latest    
      
      - name: Build & push reach
        uses: docker/build-push-action@v5
        with:
          context: ./reach
          file: ./reach/Dockerfile.staging
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/reach:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/reach:latest    

      
  Deploy:  
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
        COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install kubeseal
        run: |
          VERSION=$(curl -s https://api.github.com/repos/bitnami-labs/sealed-secrets/releases/latest | grep tag_name | cut -d '"' -f 4)
          wget https://github.com/bitnami-labs/sealed-secrets/releases/download/${VERSION}/kubeseal-${VERSION}-linux-amd64.tar.gz
          tar -xvzf kubeseal-${VERSION}-linux-amd64.tar.gz kubeseal
          sudo install -m 755 kubeseal /usr/local/bin/kubeseal
          kubeseal --version

      - name: Checkout GitOps repo
        run: |
          mkdir -p ~/gitops
          cd ~/gitops
          export GITOPS_BRANCH=${{secrets.GITOPS_BRANCH}}
          export GITOPS_REPO=${{secrets.GITOPS_REPO}}

          git clone --branch $GITOPS_BRANCH $GITOPS_REPO
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"

      - name: Update values.yml and seal secret
        run: |
          apt-get update && apt-get install -y git
          cd ~/gitops/Helm/chart.prod
          export GITOPS_BRANCH=${{secrets.GITOPS_BRANCH}}
          export GITOPS_REPO=${{secrets.GITOPS_REPO}}

    
          yq -i ".services.frontend.image = \"reach-frontend:${GITHUB_SHA}\"" values.prod.yml

          yq -i ".services.backend.image = \"reach-backend:${GITHUB_SHA}\"" values.prod.yml

          yq -i ".services.ws-server.image = \"reach-ws-server:${GITHUB_SHA}\"" values.prod.yml

          yq -i ".services.kafka_consumer1.image = \"kafka-consumer1:${GITHUB_SHA}\"" values.prod.yml

          yq -i ".services.kafka_consumer2.image = \"kafka-consumer2:${GITHUB_SHA}\"" values.prod.yml
          
      - name: Setup Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > $HOME/.kube/config
          kubectl get nodes

      - name: Create and Seal the Secret
        run: |
          cd ~/gitops/Helm/chart.prod
          kubeseal --fetch-cert --controller-name sealed-secrets-controller --controller-namespace sealed-secrets > pub-sealed-secrets.pem
          kubectl create secret docker-registry docker-secret \
          --docker-username=${{DOCKER_USERNAME}} \
          --docker-password=${{DOCKER_PASSWORD}} \
          --namespace=default \
          --dry-run=client -o yaml

          kubectl create secret generic frontend-secret \
          --from-literal=NEXT_PUBLIC_BACKEND_API_URL=${{DOCKER_USERNAME}} \
          --from-literal=secret_key=${{DOCKER_PASSWORD}} \
          --from-literal=NEXT_PUBLIC_FRONTEND_API_URL=${{DOCKER_PASSWORD}} \
          --namespace=default \
          --dry-run=client -o yaml

          kubectl create secret generic backend-secret \
          --from-literal=GOOGLE_CLIENT_ID=${{secrets.GOOGLE_CLIENT_ID}} \
          --from-literal=GOOGLE_CLIENT_SECRET=${{secrets.GOOGLE_CLIENT_SECRET}} \
          --from-literal=secret_key=${{secrets.SECRET_KEY}} \
          --from-literal=DATABASE_URL=${{secrets.DATABASE_URL}} \
          --from-literal=Redis_URL=${{secrets.REDIS_URL}} \
          --from-literal=password=${{secrets.REDIS_PASSWORD}} \
          --from-literal=port=${{secrets.REDIS_PORT}} \
          --namespace=default \
          --dry-run=client -o yaml

          kubectl create secret generic kafka-consumer-secret \
          --from-literal=DATABASE_URL=${{secrets.DATABASE_URL}} \
          --namespace=default \
          --dry-run=client -o yaml

          kubectl create secret generic ws-secret \
          --from-literal=DATABASE_URL=${{secrets.DATABASE_URL}} \
          --from-literal=Redis_URL=${{secrets.REDIS_URL}} \
          --from-literal=password=${{secrets.REDIS_PASSWORD}} \
          --from-literal=port=${{secrets.REDIS_PORT}} \
          --namespace=default \
          --dry-run=client -o yaml

          kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
           < secret/docker-secret.yaml \
           > secret/docker-sealed-secret.yaml
           rm -rf secret/docker-secret.yaml

          kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          < secret/frontend-secret.yaml \
           > secret/frontend-sealed-secret.yaml
          rm -rf secret/frontend-secret.yaml


           kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
           < secret/backend-secret.yaml \
           > secret/backend-sealed-secret.yaml
           rm -rf secret/backend-secret.yaml


          kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          < secret/kafka-consumer-secret.yaml \
          > secret/kafka-consumer-sealed-secret.yaml
          rm -rf secret/kafka-consumer-secret.yaml


          kubeseal --cert=pub-sealed-secrets.pem --format=yaml \
          < secret/ws-server-secret.yaml \
          > secret/ws-server-sealed-secret.yaml
          rm -rf secret/ws-server-secret.yaml

      - name: Commit and Push Changes
        run: |
          cd ~/gitops
          git add .
          git commit -m "Update images to SHA ${GITHUB_SHA}"
          git push
      
  
        
           
                  
    

      