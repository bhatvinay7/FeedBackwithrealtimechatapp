version: "3.8"

services:
  reach:
    build:
      context: ./reach
      dockerfile: Dockerfile
    container_name: reach
    ports:
      - "3000:3000"
    volumes:
      - ./reach:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev
    depends_on:
      - reach_backend
      - kafka1
      - kafka2
      - kafka3

  kafka_consumer1:
    build:
      context: ./kafka_consumer_1
      dockerfile: Dockerfile
    container_name: kafka_consumer1
    ports:
      - "3005:3005"
    depends_on:
      - kafka1
      - kafka2
      - kafka3

  kafka_consumer2:
    build:
      context: ./kafka_consumer_2
      dockerfile: Dockerfile
    container_name: kafka_consumer2
    ports:
      - "3006:3006"
    depends_on:
      - kafka1
      - kafka2
      - kafka3

  reach_backend:
    build:
      context: ./reach_backend
      dockerfile: Dockerfile
    container_name: reach_backend
    ports:
      - "8000:8000"

  ws_server:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    container_name: ws_server
    ports:
      - "8080:8080"
    depends_on:
      - reach_backend

  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper_data:/bitnami/zookeeper

  kafka1:
    image: bitnami/kafka:3.4
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka1:9092
      - KAFKA_CFG_DELETE_TOPIC_ENABLE=true
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_LOG_RETENTION_MS=1800000
    volumes:
      - kafka1_data:/bitnami/kafka
    depends_on:
      - reach_backend

  kafka2:
    image: bitnami/kafka:3.4
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      - KAFKA_BROKER_ID=2
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka2:9093
      - KAFKA_CFG_DELETE_TOPIC_ENABLE=true
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_LOG_RETENTION_MS=1800000
    volumes:
      - kafka2_data:/bitnami/kafka
    depends_on:
      - reach_backend

  kafka3:
    image: bitnami/kafka:3.4
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      - KAFKA_BROKER_ID=3
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka3:9094
      - KAFKA_CFG_DELETE_TOPIC_ENABLE=true
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_LOG_RETENTION_MS=1800000
    volumes:
      - kafka3_data:/bitnami/kafka
    depends_on:
      - reach_backend

volumes:
  zookeeper_data:
  kafka1_data:
  kafka2_data:
  kafka3_data: